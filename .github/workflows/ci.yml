name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      # Fail the whole matrix if any single combination breaks, rather than
      # letting one red leg hide behind a green one.
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life 2026-04-30 and was removed from the
        # matrix: it does not expand the glob in the `test` script (see the
        # note in package.json), so it cannot run this suite at all.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Verify README claims against the code
        # Fails if the README quotes a performance number that no longer
        # reproduces, names a file or endpoint that does not exist, or claims
        # a test count that has drifted from the suite.
        run: npm run verify:readme

      - name: Verify diagram assets
        # Well-formed XML, no scripts, no external references, and the file
        # tree and banner counts still matching the working tree.
        run: npm run verify:diagrams

  audit:
    name: Dependency audit
    # One leg is enough: the dependency tree does not depend on the Node
    # major, so running it twice would only duplicate work.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
