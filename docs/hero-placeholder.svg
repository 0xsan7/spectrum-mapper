<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300"
     role="img" aria-labelledby="t d">
  <title id="t">Demo placeholder</title>
  <desc id="d">A placeholder standing in for a screen recording of the app. No
  recording has been made yet. See docs/README-hero.md.</desc>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0033ff"/>
      <stop offset="0.5" stop-color="#00c853"/>
      <stop offset="0.8" stop-color="#ffd400"/>
      <stop offset="1" stop-color="#ff1744"/>
    </linearGradient>
  </defs>

  <rect width="760" height="300" fill="url(#g)"/>

  <!-- A deliberately faint, obviously-not-real preview. -->
  <g opacity="0.16">
    <rect x="40" y="46" width="420" height="210" fill="#111" stroke="#1e2833"/>
    <rect x="56" y="62" width="388" height="178" fill="url(#heat)" opacity="0.5"/>
    <g fill="#000" opacity="0.35">
      <circle cx="120" cy="200" r="9"/>
      <circle cx="380" cy="110" r="9"/>
      <circle cx="250" cy="160" r="7"/>
    </g>
    <g fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6">
      <rect x="80" y="80" width="24" height="24"/>
      <rect x="360" y="70" width="24" height="24"/>
    </g>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="500" y="120" fill="#6e7b8b" font-size="13">No demo yet.</text>
    <text x="500" y="144" fill="#8b98a8" font-size="12">The README claims</text>
    <text x="500" y="162" fill="#8b98a8" font-size="12">nothing it cannot</text>
    <text x="500" y="180" fill="#8b98a8" font-size="12">show.</text>
    <text x="500" y="222" fill="#4d5a6b" font-size="11">docs/README-hero.md</text>
  </g>
</svg>
