<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160"
     font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
     role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Spectrum Mapper file system</title>
  <desc id="bannerDesc">A section banner reading Spectrum-Mapper file system, with a
    glowing horizontal rule and a file count. The tree itself is in the README below it.</desc>

  <defs>
    <filter id="bGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bGlowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="0.5"  stop-color="#ff2bd6" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="bGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="bScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <style>
    .bt { font-size: 26px; letter-spacing: 0.22em; font-weight: 700; }
    .bs { font-size: 10px; letter-spacing: 0.16em; }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
    .bsweep { animation: sweep 6s linear infinite; }
    @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.86; } }
    .bflick { animation: flicker 3.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bsweep, .bflick { animation: none; }
    }
  </style>

  <rect width="1200" height="160" fill="#0a0e14"/>
  <rect width="1200" height="160" fill="url(#bGrid)"/>

  <!-- HUD corner brackets -->
  <g stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1.5" fill="none" filter="url(#bGlowSoft)">
    <path d="M18 40V18H40"/><path d="M1160 18h22v22"/>
    <path d="M1182 120v22h-22"/><path d="M40 142H18v-22"/>
  </g>

  <text x="600" y="72" class="bt bflick" fill="#00e5ff" text-anchor="middle"
        filter="url(#bGlow)">SPECTRUM-MAPPER // FILE SYSTEM</text>

  <!-- glowing underline -->
  <rect x="120" y="92" width="960" height="2" fill="url(#rule)" filter="url(#bGlow)"/>
  <rect x="120" y="90" width="960" height="1" fill="url(#rule)" fill-opacity="0.5"/>

  <!-- travelling highlight along the rule -->
  <rect class="bsweep" x="0" y="90" width="180" height="4" fill="#ffffff" fill-opacity="0.10" pointer-events="none"/>

  <!-- Plain ASCII labels, not emoji. The brief rules out external fonts, and
       an emoji is not in any monospace fallback, so it renders as a row of
       missing-glyph boxes in a bare renderer (confirmed with resvg). The
       README's file tree keeps its emoji, where the surrounding text supplies
       the glyph. -->
  <!-- Folder counts, minus the test count: that number moves on nearly every
       commit, and pinning it in the artwork meant editing the SVG to add a
       test. The README tree carries the same information. -->
  <text x="600" y="116" class="bs" fill="#5f8794" text-anchor="middle">
    SRC 13 · PUBLIC 17 · SCRIPTS 6 · DOCS 12
  </text>
  <text x="600" y="136" class="bs" fill="#2f4a56" text-anchor="middle">
    src, public, scripts and docs counts follow git ls-files — verify:diagrams checks them
  </text>

  <rect width="1200" height="160" fill="url(#bScan)" pointer-events="none"/>
</svg>
