<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"
     font-family="'JetBrains Mono','SF Mono',Consolas,monospace"
     role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Spectrum Mapper architecture</title>
  <desc id="archDesc">Four transmitters radiate into a 20 by 15 metre room. A Node.js server
    advances the simulation, applies a log-distance path loss model, builds a 300 cell heatmap
    grid and localises the mobile device by trilateration, then pushes JSON to the browser over a
    WebSocket twice a second. The browser renders a canvas heatmap, an RSSI and error chart with
    movement trails, and the controls that send changes back.</desc>

  <defs>
    <!-- Neon glow. Three separate filters so a block can be tinted without
         inheriting another block's colour. -->
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMagenta" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.16"/>
    </pattern>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#00e5ff"/>
    </marker>

    <clipPath id="panelL"><rect x="118" y="120" width="316" height="392" rx="3"/></clipPath>
    <clipPath id="panelR"><rect x="766" y="120" width="316" height="392" rx="3"/></clipPath>
  </defs>

  <style>
    .lbl  { font-size: 11px; letter-spacing: 0.14em; }
    .ttl  { font-size: 13px; letter-spacing: 0.20em; font-weight: 700; }
    .det  { font-size: 9.5px; letter-spacing: 0.02em; }
    /* The full path-loss formula is long; it needs to fit inside a 276px
       panel, which 9.5px overshoots by ~30px. */
    .fx   { font-size: 8px; letter-spacing: 0; }
    .num  { font-size: 10px; letter-spacing: 0.06em; }
    .tiny { font-size: 8.5px; letter-spacing: 0.10em; }
    /* Transmitter labels sit in a narrow column between the dots and the
       server panel, so they run a size down from the panel captions. */
    .txl  { font-size: 7.5px; letter-spacing: 0.04em; }
    .box  { fill: #0d1420; stroke-width: 1.2; }
    .link { fill: none; stroke-width: 1.3; }

    /* Dashed data line between the panels. */
    @keyframes flow { to { stroke-dashoffset: -48; } }
    .flow { stroke-dasharray: 10 14; animation: flow 1.6s linear infinite; }

    /* Packets travelling in each direction. */
    @keyframes toBrowser { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes toServer  { from { offset-distance: 100%; } to { offset-distance: 0%; } }
    .pkt-out { offset-path: path('M488 316 H730'); animation: toBrowser 1.6s linear infinite; }
    .pkt-in  { offset-path: path('M730 356 H488'); animation: toServer 1.6s linear infinite; }

    /* Transmitter pulse rings. */
    @keyframes pulse {
      0%   { r: 5;  opacity: 0.85; }
      70%  { r: 19; opacity: 0; }
      100% { r: 19; opacity: 0; }
    }
    .ring { animation: pulse 3.2s ease-out infinite; }
    .ring.d1 { animation-delay: 0.8s; }
    .ring.d2 { animation-delay: 1.6s; }
    .ring.d3 { animation-delay: 2.4s; }

    @keyframes sweep { from { transform: translateY(0); } to { transform: translateY(640px); } }
    .sweep { animation: sweep 7s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .flow, .pkt-out, .pkt-in, .ring, .sweep { animation: none; }
      .pkt-out { offset-distance: 50%; }
      .pkt-in  { offset-distance: 50%; }
    }
  </style>

  <!-- ===== background ===== -->
  <rect width="1200" height="640" fill="#0a0e14"/>
  <rect width="1200" height="640" fill="url(#grid)"/>

  <!-- HUD corner brackets -->
  <g stroke="#00e5ff" stroke-opacity="0.55" stroke-width="1.6" fill="none" filter="url(#glowSoft)">
    <path d="M20 44V20H44"/><path d="M1156 20h24v24"/>
    <path d="M1180 596v24h-24"/><path d="M44 620H20v-24"/>
  </g>

  <!-- ===== title bar ===== -->
  <text x="600" y="46" class="ttl" fill="#00e5ff" text-anchor="middle"
        filter="url(#glowCyan)">SPECTRUM-MAPPER // SYSTEM ARCHITECTURE</text>
  <text x="600" y="64" class="tiny" fill="#4a7a8a" text-anchor="middle">
    20 × 15 m ROOM · 1 m GRID · 300 CELLS · 2.4 GHz · 2 Hz
  </text>
  <line x1="360" y1="74" x2="840" y2="74" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- ===== transmitters, far left ===== -->
  <text x="20" y="104" class="lbl" fill="#ff2bd6">TX</text>

  <g>
    <!-- Router A -->
    <circle class="ring"       cx="52" cy="140" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.4"/>
    <circle class="ring d1"    cx="52" cy="140" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.2"/>
    <circle class="ring d2"    cx="52" cy="140" r="5" fill="none" stroke="#ff2bd6" stroke-width="1"/>
    <circle cx="52" cy="140" r="4.5" fill="#ff2bd6" filter="url(#glowMagenta)"/>
    <text x="66" y="137" class="num" fill="#ff2bd6">TX-1</text>
    <text x="66" y="150" class="txl" fill="#7a5a80">Router A</text>
    <text x="66" y="162" class="txl" fill="#5c4a63">20 dBm</text>

    <!-- Router B -->
    <circle class="ring"       cx="52" cy="248" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.4"/>
    <circle class="ring d1"    cx="52" cy="248" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.2"/>
    <circle class="ring d2"    cx="52" cy="248" r="5" fill="none" stroke="#ff2bd6" stroke-width="1"/>
    <circle cx="52" cy="248" r="4.5" fill="#ff2bd6" filter="url(#glowMagenta)"/>
    <text x="66" y="245" class="num" fill="#ff2bd6">TX-2</text>
    <text x="66" y="258" class="txl" fill="#7a5a80">Router B</text>
    <text x="66" y="270" class="txl" fill="#5c4a63">15 dBm</text>

    <!-- Mobile device: the one being localised -->
    <circle class="ring"       cx="52" cy="356" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.4"/>
    <circle class="ring d1"    cx="52" cy="356" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.2"/>
    <circle class="ring d2"    cx="52" cy="356" r="5" fill="none" stroke="#ff2bd6" stroke-width="1"/>
    <circle cx="52" cy="356" r="4.5" fill="#ff2bd6" filter="url(#glowMagenta)"/>
    <circle cx="52" cy="356" r="9" fill="none" stroke="#ff2bd6" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="66" y="353" class="num" fill="#ff2bd6">TX-3</text>
    <text x="66" y="366" class="txl" fill="#7a5a80">Mobile Device</text>
    <text x="66" y="378" class="txl" fill="#5c4a63">10 dBm</text>
    <text x="66" y="390" class="txl" fill="#39ff88">▲ localised</text>

    <!-- BLE beacon -->
    <circle class="ring"       cx="52" cy="464" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.4"/>
    <circle class="ring d1"    cx="52" cy="464" r="5" fill="none" stroke="#ff2bd6" stroke-width="1.2"/>
    <circle class="ring d2"    cx="52" cy="464" r="5" fill="none" stroke="#ff2bd6" stroke-width="1"/>
    <circle cx="52" cy="464" r="4.5" fill="#ff2bd6" filter="url(#glowMagenta)"/>
    <text x="66" y="461" class="num" fill="#ff2bd6">TX-4</text>
    <text x="66" y="474" class="txl" fill="#7a5a80">BLE Beacon</text>
    <text x="66" y="486" class="txl" fill="#5c4a63">5 dBm</text>
  </g>

  <!-- ===== left panel: server ===== -->
  <!-- Shifted 18px right: the TX label column needs ~132px and the panel used
       to start at 118, so "Mobile Device" and "▲ localised" ran into it. -->
  <g transform="translate(18,0)">
    <rect x="118" y="120" width="316" height="392" rx="3" class="box"
          stroke="#00e5ff" filter="url(#glowCyan)"/>
    <!-- header strip -->
    <rect x="118" y="120" width="316" height="30" fill="#00e5ff" fill-opacity="0.09"/>
    <line x1="118" y1="150" x2="434" y2="150" stroke="#00e5ff" stroke-opacity="0.45"/>
    <text x="276" y="140" class="ttl" fill="#00e5ff" text-anchor="middle">NODE.JS SERVER</text>
    <text x="426" y="140" class="tiny" fill="#4a7a8a" text-anchor="end">:3000</text>

    <!-- Simulation -->
    <rect x="138" y="166" width="276" height="62" rx="2" class="box" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="150" y="186" class="lbl" fill="#00e5ff">SIMULATION</text>
    <text x="150" y="203" class="det" fill="#9fd8e8">4 sources · step 500 ms · 2 pinned</text>
    <text x="150" y="218" class="det" fill="#5f8794">v = (vx, vy) reflected at walls</text>

    <!-- Path loss -->
    <rect x="138" y="242" width="276" height="70" rx="2" class="box" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="150" y="262" class="lbl" fill="#00e5ff">PATH LOSS</text>
    <text x="150" y="279" class="fx" fill="#9fd8e8">RSSI = Tx − PL(d₀) − 10n·log₁₀(d/d₀) − walls − fading</text>
    <text x="150" y="293" class="det" fill="#5f8794">n = 2.7 · f = 2437 MHz · d₀ = 1 m</text>
    <text x="150" y="306" class="det" fill="#5f8794">combined in linear power, not dBm</text>

    <!-- Heatmap grid -->
    <rect x="138" y="326" width="276" height="62" rx="2" class="box" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="150" y="346" class="lbl" fill="#00e5ff">HEATMAP GRID</text>
    <text x="150" y="363" class="det" fill="#9fd8e8">20 × 15 m ÷ 1 m = 300 cells</text>
    <text x="150" y="378" class="det" fill="#5f8794">range −100…−20 dBm · 501 µs</text>

    <!-- Trilateration -->
    <rect x="138" y="402" width="276" height="62" rx="2" class="box" stroke="#39ff88" stroke-opacity="0.75"/>
    <text x="150" y="422" class="lbl" fill="#39ff88">TRILATERATION</text>
    <text x="150" y="439" class="det" fill="#a8f5c8">4 receivers · least squares</text>
    <text x="150" y="454" class="det" fill="#5f9a7a">error 1.8 m centre → 5.5 m edge</text>

    <!-- RX nodes, drawn inside the server panel because that is where the
         readings are actually taken. Two lines: all four ids on one line runs
         32px past the panel edge. -->
    <text x="150" y="478" class="tiny" fill="#4a7a8a">RX-1 (2,2) · RX-2 (18,2)</text>
    <text x="150" y="490" class="tiny" fill="#4a7a8a">RX-3 (10,13) · RX-4 (10,2)</text>
    <g fill="none" stroke="#39ff88" stroke-width="1.2">
      <rect x="372" y="471" width="7" height="7"/>
      <rect x="386" y="471" width="7" height="7"/>
      <rect x="372" y="483" width="7" height="7"/>
      <rect x="386" y="483" width="7" height="7"/>
    </g>

    <!-- validator note -->
    <line x1="138" y1="497" x2="414" y2="497" stroke="#00e5ff" stroke-opacity="0.18"/>
    <text x="276" y="508" class="tiny" fill="#3f5a66" text-anchor="middle">every inbound command is validated</text>
  </g>

  <!-- internal server flow arrows -->
  <g stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1" marker-end="url(#arrowCyan)">
    <line x1="294" y1="230" x2="294" y2="240"/>
    <line x1="294" y1="314" x2="294" y2="324"/>
    <line x1="294" y1="390" x2="294" y2="400"/>
  </g>

  <!-- ===== right panel: browser ===== -->
  <g>
    <rect x="766" y="120" width="316" height="392" rx="3" class="box"
          stroke="#39ff88" filter="url(#glowGreen)"/>
    <rect x="766" y="120" width="316" height="30" fill="#39ff88" fill-opacity="0.09"/>
    <line x1="766" y1="150" x2="1082" y2="150" stroke="#39ff88" stroke-opacity="0.45"/>
    <text x="924" y="140" class="ttl" fill="#39ff88" text-anchor="middle">BROWSER</text>
    <text x="1074" y="140" class="tiny" fill="#4a8a6a" text-anchor="end">CANVAS 2D</text>

    <!-- WS client -->
    <rect x="786" y="166" width="276" height="62" rx="2" class="box" stroke="#39ff88" stroke-opacity="0.7"/>
    <text x="798" y="186" class="lbl" fill="#39ff88">WS CLIENT</text>
    <text x="798" y="203" class="det" fill="#a8f5c8">one socket · 2 frames / s</text>
    <text x="798" y="218" class="det" fill="#5f9a7a">snapshot on connect, then deltas</text>

    <!-- Canvas heatmap -->
    <rect x="786" y="242" width="276" height="70" rx="2" class="box" stroke="#39ff88" stroke-opacity="0.7"/>
    <text x="798" y="262" class="lbl" fill="#39ff88">CANVAS HEATMAP</text>
    <text x="798" y="279" class="det" fill="#a8f5c8">cells · walls · trails · markers</text>
    <text x="798" y="293" class="det" fill="#5f9a7a">crosshair = trilateration estimate</text>
    <text x="798" y="306" class="det" fill="#5f9a7a">legend shares the same colour ramp</text>

    <!-- Chart -->
    <rect x="786" y="326" width="276" height="62" rx="2" class="box" stroke="#39ff88" stroke-opacity="0.7"/>
    <text x="798" y="346" class="lbl" fill="#39ff88">RSSI CHART + TRAILS</text>
    <text x="798" y="363" class="det" fill="#a8f5c8">240 samples = last 2 min</text>
    <text x="798" y="378" class="det" fill="#5f9a7a">error on its own 0…max scale</text>

    <!-- Controls -->
    <rect x="786" y="402" width="276" height="62" rx="2" class="box" stroke="#39ff88" stroke-opacity="0.7"/>
    <text x="798" y="422" class="lbl" fill="#39ff88">CONTROLS</text>
    <text x="798" y="439" class="det" fill="#a8f5c8">n · f · fading · drag · walls</text>
    <text x="798" y="454" class="det" fill="#5f9a7a">PNG / CSV export buttons</text>

    <text x="924" y="504" class="tiny" fill="#3f5a66" text-anchor="middle">the browser renders; it never computes physics</text>
  </g>

  <g stroke="#39ff88" stroke-opacity="0.35" stroke-width="1" marker-end="url(#arrowCyan)">
    <line x1="924" y1="230" x2="924" y2="240"/>
    <line x1="924" y1="314" x2="924" y2="324"/>
    <line x1="924" y1="390" x2="924" y2="400"/>
  </g>

  <!-- return path: browser → server, offset below the outbound line -->
  <path d="M786 434 C 700 434, 640 440, 570 440 L 488 440" class="link"
        stroke="#ff2bd6" stroke-opacity="0.4" stroke-dasharray="4 6" fill="none"/>
  <text x="600" y="432" class="tiny" fill="#ff2bd6" text-anchor="middle" fill-opacity="0.8">commands up: move · setParam · addWall</text>

  <!-- ===== centre: the data line ===== -->
  <g>
    <line x1="488" y1="316" x2="730" y2="316" class="link flow" stroke="#00e5ff" filter="url(#glowCyan)"/>
    <line x1="488" y1="356" x2="730" y2="356" class="link flow" stroke="#39ff88"
          stroke-dasharray="6 10" filter="url(#glowGreen)" style="animation-direction: reverse"/>

    <circle r="3" class="pkt-out" fill="#00e5ff" filter="url(#glowCyan)"/>
    <circle r="3" class="pkt-in"  fill="#39ff88" filter="url(#glowGreen)"/>

    <text x="600" y="302" class="num" fill="#00e5ff" text-anchor="middle">JSON / 500ms</text>
    <text x="600" y="376" class="tiny" fill="#39ff88" text-anchor="middle">Δ 17 KB per frame</text>

    <!-- port terminators -->
    <circle cx="488" cy="316" r="3.5" fill="#0a0e14" stroke="#00e5ff" stroke-width="1.2"/>
    <circle cx="730" cy="316" r="3.5" fill="#0a0e14" stroke="#00e5ff" stroke-width="1.2"/>
    <circle cx="488" cy="356" r="3.5" fill="#0a0e14" stroke="#39ff88" stroke-width="1.2"/>
    <circle cx="730" cy="356" r="3.5" fill="#0a0e14" stroke="#39ff88" stroke-width="1.2"/>
  </g>

  <!-- signal coupling from the TX column into the server panel -->
  <g stroke="#ff2bd6" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M62 140 C 96 140, 104 200, 134 250"/>
    <path d="M62 248 C 100 248, 108 260, 134 300"/>
    <path d="M62 356 C 104 356, 110 350, 134 350"/>
    <path d="M62 464 C 96 464, 104 420, 134 380"/>
  </g>

  <!-- ===== footer ===== -->
  <line x1="360" y1="540" x2="840" y2="540" stroke="#00e5ff" stroke-opacity="0.3"/>
  <text x="600" y="560" class="det" fill="#7f9aa8" text-anchor="middle">
    RSSI = Tx − PL(d₀) − 10n·log₁₀(d/d₀) − walls − fading
  </text>
  <text x="600" y="578" class="det" fill="#4a7a8a" text-anchor="middle">
    sources combine in linear power · two receivers cannot disambiguate a mirrored position
  </text>
  <text x="600" y="600" class="tiny" fill="#2f4a56" text-anchor="middle">
    measured on Node v26.7.0 darwin/arm64 — see README § performance
  </text>

  <!-- scanline overlay, and a slow sweep bar -->
  <rect width="1200" height="640" fill="url(#scan)" pointer-events="none"/>
  <rect class="sweep" x="0" y="-40" width="1200" height="40" fill="#00e5ff" fill-opacity="0.03" pointer-events="none"/>
</svg>
